# Production / self-hosted stack for running the Dreamer PLATFORM ITSELF
# (dashboard + api-server + reverse-proxy + its own Postgres/Redis) on a
# single VPS/EC2 box — driven by scripts/install.sh, not meant to be run
# directly on its own without the env files that script generates.
#
# Deliberately a SEPARATE file from the root docker-compose.yml (which
# stays as the local-dev convenience file it always was) rather than an
# overlay on top of it — Compose's array-merging rules (ports, volumes)
# are easy to get subtly wrong across two files; one self-contained file
# is easier to read top-to-bottom and easier to be certain about.
#
# NOT included here: build-engine. It has nothing to do with hosting this
# control plane — it's launched directly by AWS ECS RunTask (see
# deployment-engine.ts), on-demand, per build, regardless of where
# api-server/frontend/postgres/redis themselves run. Actual USER APP
# deployments still go out to AWS (ECS + Lambda) even when the Dreamer
# platform's own control plane is self-hosted here — see
# docs/AWS-Console-Setup-Guide.md for that side, which is unchanged by
# this file.
#
# Security posture: ONLY nginx publishes a host port (80/443). Every other
# service — postgres, redis, api-server, frontend, reverse-proxy — is
# reachable ONLY over the private compose network, by service name, never
# from the host or the public internet directly. This is what "no cloud
# Postgres/Redis needed" actually means in practice: they're exactly as
# private as a managed provider's VPC-only instance would be, just running
# as containers on this box instead.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dreamer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.deploy, generated by scripts/lib/generate-env.sh}
      POSTGRES_DB: ${POSTGRES_DB:-dreamer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dreamer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-server:
    build:
      context: ./apps/api-server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/api-server/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        # Baked into the Next.js build at BUILD time (these are
        # NEXT_PUBLIC_* vars — they end up in client-side JS bundles, so
        # they have to be known before `npm run build` runs, not supplied
        # as a runtime container env var the way api-server's config is).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    restart: unless-stopped

  reverse-proxy:
    build:
      context: ./apps/reverse-proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/reverse-proxy/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Substituted into nginx/templates/*.template at container start —
      # nginx's own official image does this automatically for anything
      # mounted under /etc/nginx/templates/, no custom entrypoint needed.
      DOMAIN: ${DOMAIN:?DOMAIN must be set — see .env.deploy}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - api-server
      - reverse-proxy

volumes:
  postgres_data:
  redis_data:
